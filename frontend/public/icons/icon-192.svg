<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ScooterRent S icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#123328"/>
      <stop offset="55%" stop-color="#07110f"/>
      <stop offset="100%" stop-color="#020405"/>
    </radialGradient>

    <linearGradient id="sGradient" x1="120" y1="420" x2="390" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#35f08b"/>
      <stop offset="45%" stop-color="#b9ffe2"/>
      <stop offset="100%" stop-color="#6effb8"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.10
                0 0 0 0 1.00
                0 0 0 0 0.52
                0 0 0 0.85 0" result="greenGlow"/>
      <feMerge>
        <feMergeNode in="greenGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#020405"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#bg)" stroke="#6ee7b7" stroke-width="7" filter="url(#glow)"/>

  <circle cx="256" cy="256" r="162" fill="none" stroke="rgba(110,231,183,0.16)" stroke-width="3"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="rgba(110,231,183,0.10)" stroke-width="3"/>

  <text
    x="256"
    y="348"
    text-anchor="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="285"
    font-weight="900"
    fill="url(#sGradient)"
    stroke="#edfff5"
    stroke-width="9"
    paint-order="stroke fill"
    filter="url(#glow)"
  >S</text>
</svg>
